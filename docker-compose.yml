services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ems_user
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: employee_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_user -d employee_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql+asyncpg://ems_user:123456789@db:5432/employee_management
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app  # live-reload friendly for dev; remove for production images

volumes:
  pgdata: